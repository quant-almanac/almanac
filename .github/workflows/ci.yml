name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check public snapshot safety
        run: python scripts/check_public_safety.py --history HEAD

  # ⚠️ lint と test を分けたジョブにする (以前は同じジョブの逐次ステップで、
  # ruff の失敗がそこでジョブを止め、Import smoke test と pytest が
  # 一度も実行されないまま skip されていた — レビューで実測: analyst/ の
  # 既存 lint 負債47件で lint-and-test が毎回赤くなり、その後ろの
  # pytest がずっと未実行だった)。
  #
  # ruff の既存負債はこのラウンドのスコープ外。直さず放置するのではなく、
  # 「lint は赤いままだが test は独立して緑になる」状態を正直に示す。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check \
            utils.py \
            behavioral_guard.py \
            rebalance_engine.py \
            data_fetcher.py \
            weekly_report.py \
            portfolio_analyst.py \
            analyst/ \
            --select E,F,W \
            --ignore E501,W291,W293,E402 \
            --output-format=github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 重い ML パッケージ（torch/transformers/vectorbt）を除いたCI用依存を先にインストール
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi uvicorn \
            anthropic \
            yfinance feedparser \
            pandas numpy pyarrow requests \
            scipy scikit-learn pyportfolioopt \
            quantstats \
            fredapi \
            pytest

      # ── インポートチェック ─────────────────────────────
      - name: Import smoke test
        run: |
          python -c "from utils import atomic_write_json; print('utils OK')"
          python -c "from analyst.cache import is_cache_valid; print('analyst.cache OK')"
          python -c "from analyst.llm_client import call_claude; print('analyst.llm_client OK')"
          python -c "from rebalance_engine import calculate_medium_drift; print('rebalance_engine OK')"
          python -c "from behavioral_guard import check_position_stops; print('behavioral_guard OK')"

      # ── ユニットテスト ─────────────────────────────────
      - name: Run unit tests
        env:
          # ダミー値でAPIキーが必要なテストをスキップ
          ANTHROPIC_API_KEY: "dummy"
          DEEPSEEK_API_KEY:  "dummy"
          FRED_API_KEY:      "dummy"
        run: |
          pytest tests/ -v --tb=short -x \
            --ignore=tests/test_integration.py

  # ── フロントエンド ────────────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: TypeScript type check
        run: npx tsc --noEmit

      # ⚠️ `next lint --max-warnings 20` は現在の Next.js では
      # `unknown option '--max-warnings'` で即失敗する。package.json の
      # lint スクリプトは既に素の eslint へ移行済み (`"lint": "eslint"`)
      # なので、CI もそれに追従する (レビューで実測)。
      - name: ESLint
        run: npm run lint

  # ⚠️ frontend の vitest (189件) は CI で一度も実行されていなかった
  # (レビューで指摘)。
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Run frontend tests
        run: npm test -- --run
